# nginx site for MyTrackHub: one address for the website and the API.
#
#   http://SERVER/            → admin website (static files from `npm run generate`)
#   http://SERVER/api/v1/…    → API (pm2 "mytrackhub-api", port 4000)
#   http://SERVER/health      → API health check
#
# The website calls the API on the same address, so no CORS and no
# NUXT_PUBLIC_API_BASE are needed. The mobile app sends to
#   POST http://SERVER/api/v1/track   (header x-api-key)
#
# Install:
#   sudo cp deploy/nginx-mytrackhub.conf /etc/nginx/sites-available/mytrackhub
#   sudo ln -sf /etc/nginx/sites-available/mytrackhub /etc/nginx/sites-enabled/mytrackhub
#   sudo nginx -t && sudo systemctl reload nginx

upstream mytrackhub_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /var/www/MyTrackHub/admin/.output/public;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API: passed on unchanged (/api/v1/… stays /api/v1/…) ──
    location /api/ {
        proxy_pass http://mytrackhub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # long SQL Query page queries
    }

    # Live updates (Server-Sent Events): no buffering, stay open.
    location /api/v1/admin/stream {
        proxy_pass http://mytrackhub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /health {
        proxy_pass http://mytrackhub_api;
    }

    # ── Website ──
    # Built files have a hash in their name: cache them for a year.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other page is the single-page app (index.html is never cached,
    # so a new build is picked up at once).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
